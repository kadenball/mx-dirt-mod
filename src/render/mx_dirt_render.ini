; MX Dirt Mod - render plugin settings (plugins\mx_dirt_render.ini)
; Read once when MX Bikes starts. Restart the game after editing.
; Lines starting with ; are comments.

[renderer]
; 1 = render plugin on, 0 = off (the game runs exactly as without it).
enabled=1

; Dirt Material: reshades the game's own ground where it was ridden -
; ruts, packed lines, loose/torn dirt, damp rut bottoms, roost clods - from
; the dirt simulation in mx_dirt.dlo. 1 = on, 0 = off.
dirt_material=1

; Overall strength of the dirt shading, percent. 0..200 (100 = nominal).
dirt_strength=135

; Fine loose-soil grain on worked ground, percent. 0..100.
dirt_loose=55

; Distance from the camera (metres) where the effect starts to fade and
; where it is gone. Must satisfy dirt_fade_start < dirt_fade_end <= 100.
; (The dirt is drawn up to about 95 m ahead and 65 m to the sides.)
dirt_fade_start=75
dirt_fade_end=100

; Any dirt_* value out of range switches only the Dirt Material off.

; Soft dirt layer: loose top soil with tyre trenches, lips, roost crumbs and
; knob prints (look only; thickness is soft_layer_mm in mx_dirt.ini).
; 1 = on, 0 = off. Needs dirt_material=1.
soft_layer=1

; Solid soft layer: the ground's own texture follows the layer's relief, so
; trenches and lips read as real displaced dirt. 0 = relief shading only.
soft_solid=1

; Tyres sink into raised loose soil instead of being drawn on top of it.
tyre_sink=1

; Raised-dirt surface fix: the game shows its bottom terrain layer on ground
; pushed ABOVE its original height (berms, roost piles). 1 = keep the surface
; layer there (fix on), 0 = native behaviour.
raised_dirt_surface=1

; Diagnostic log, absolute or relative to the MX Bikes folder.
; Leave empty (content_log=) for no log.
content_log=plugins\mx_dirt_render.log

; MX Dirt core plugin settings (plugins\mx_dirt.ini, read when MX Bikes starts).
; Every key is optional: a missing key uses the default shown here.
; An out-of-range value disables the plugin for that game start (see plugins\mx_dirt.jsonl).

[active]
; 1 = on, 0 = off (MX Bikes runs vanilla)
enabled=1

[soil]
; --- Ground ---
; How deep tyres cut, 10..300. Scaled by the in-game Deformation slider (see below).
dirt_sim_depth_percent=60
; Untouched ground firmness, 0 loose .. 100 hard-pack.
dirt_sim_firmness_percent=55
; Soil moisture, 0 dry/dusty .. 35 ideal .. 100 wet/muddy.
dirt_sim_moisture_percent=35
; How hard a fully ridden-in line gets, 25..200.
packed_hardness_percent=100
; How fast sliding tyres break packed crust loose, 0..300.
breakdown_percent=100
; How fast the track dries during a ride, 0 (never) .. 400.
drying_percent=100
; How strongly tyres push loose soil off the line, 0..300.
sweep_percent=100

; --- Rut shape, 0..300 each ---
; Tyres drop into existing grooves.
rut_capture_percent=100
; Damp rut walls hold steep.
wall_cohesion_percent=100
; Roost lands as scattered clods.
roost_clods_percent=100
; 1 = sharper ruts (vertex-exact publication), but ruts along a diagonal can show teeth.
sharp_ruts=0

; --- Bumps ---
; Braking bumps / bump stress, 0..200 (0 = no bumps and no live gate lines).
braking_bumps_percent=100
; Bumps from any wheel hop without braking or drive, 0..100.
rolling_bumps_percent=60

; --- Live riding ---
; How much each of your own laps wears the track, 0..200.
; 100 = Medium (default): ~15 of your laps wear a track about like the "Practice" pre-wear.
; 0 = Low: slow, realistic one-rider wear (your line packs in, bumps stay small).
; 200 = the launcher's Arcade preset (which also changes several other settings below).
live_wear_percent=100
; Your live wear shared over N lines riding with you, 1..8 (1 = only your own line).
live_gate_lines=1
; Extra riders replaying each of your contacts on spread lines, 0..15 (testing / busy track).
extra_riders=0

; --- Lap recordings and pre-wear ---
; Save every valid lap to plugins\mx_dirt_laps\<track>\ (laps from pre-release builds in
; plugins\mxb_reflex_ghosts\<track>\ are still read when a track has no new laps).
record_ghosts=1
; Recorded laps replayed live as invisible riders, 0..12.
ghost_riders=0
; Pre-wear: when a track loads, this many virtual riders ride your 4 fastest recorded laps,
; so the track starts worn. 0 = off. Needs at least one recorded lap on that track.
; About 25 practice, 50 after moto 1 (default), 80 end of day, 130 destroyed.
prewear_riders=50
; How far the virtual riders spread across the track, cm (0..500).
prewear_spread_cm=140
; Pre-wear clip, cm (0..600).
prewear_clip_cm=400
; 1 = pre-wear only a fresh track (a saved, already ridden track is left as it is);
; 0 = pre-wear on every load (wear stacks up).
prewear_fresh_only=1

; --- Soft dirt layer (look only) ---
; Loose top soil lying on the track, mm (0 = off, 5..100). Tyres press trenches into it,
; push lips up beside the tread, roost crumbs back and shove mounds when braking. It is
; drawn by mx_dirt_render.dlo and never changes the ruts the bike rides. Sand lies ~1.8x
; deeper, hard-pack and gravel thinner; it follows the dirt sim: deeper on loose soil and a softer track,
; thinner and ironed flat on packed lines, crisp prints and tall lips when damp, crumbly when dry. Marks are saved with the track's wear in
; plugins\mx_dirt_soft\<track>\.
soft_layer_mm=85

; --- In-game Deformation slider ---
; 1 = the in-game Deformation setting scales dirt_sim_depth_percent; 0 = ignore it.
follow_game_deformation=1
; Slider value (percent) at which dirt_sim_depth_percent applies unchanged, 1..200.
game_deformation_reference_percent=25

; Comma list of track-name fragments whose soil the dirt sim treats as sand (e.g. southwick).
sand_tracks=

[debug]
; 1 = save each track's terrain once to plugins\mx_dirt_terrain\<track>.mxt (offline analysis).
dump_terrain=0
